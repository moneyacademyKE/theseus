<!doctype html>
<html lang="en" data-conn="connecting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THESEUS · deck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2339c5cf'/></svg>">
<link rel="stylesheet" href="/css/deck.css">
<link rel="stylesheet" href="/css/content.css">
<link rel="stylesheet" href="/css/login.css">
<link rel="stylesheet" href="/css/cockpit.css">
<link rel="stylesheet" href="/vendor/uplot.min.css?v=1.6.32">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'">
</head>
<body>
<noscript>
  <div class="login-error">The deck is a live cockpit — it needs JavaScript. Enable it and reload.</div>
</noscript>
<header id="topbar">
  <div class="brand"><span class="glyph">◉</span>THESEUS<span class="tag">deck</span></div>
  <div class="meta">
    <span id="api-state" class="dim" role="status" aria-live="polite">connecting…</span>
    <span id="live" class="led off" role="img" aria-label="push stream offline"></span>
    <button type="button" id="pip-toggle" class="pip-toggle" title="mini cockpit in an always-on-top window (Picture-in-Picture)" aria-label="open mini cockpit" hidden>⧉</button>
    <span id="clock" class="mono">--:--:-- EAT</span>
  </div>
</header>

<main id="deck">
  <section class="col col-wide" id="col-cockpit">
    <header><h2>cockpit</h2><span class="count" id="cockpit-status" role="status" aria-live="polite">idle</span></header>
    <div class="cockpit">
      <div class="cockpit-sessions">
        <label class="sr-only" for="cockpit-session">session</label>
        <select id="cockpit-session" title="session — the same files Telegram turns append to"></select>
        <button type="button" id="cockpit-search" title="search sessions (FTS over every transcript)" aria-label="search sessions">⌕</button>
        <button type="button" id="cockpit-new" title="fresh session" aria-label="start a fresh session">+ new</button>
      </div>
      <div class="cockpit-searchbar" id="cockpit-searchbar" hidden>
        <label class="sr-only" for="cockpit-search-input">search sessions</label>
        <input id="cockpit-search-input" type="search" placeholder="search all sessions — Enter to run" autocomplete="off">
        <button type="button" id="cockpit-search-close" title="close search" aria-label="close search">×</button>
      </div>
      <div class="cockpit-search-results" id="cockpit-search-results" hidden aria-label="search results"></div>
      <div class="cockpit-transcript" id="cockpit-transcript" role="log" aria-live="polite" aria-label="cockpit transcript"></div>
      <div class="cockpit-job" id="cockpit-job" hidden></div>
      <form class="cockpit-compose" id="cockpit-form">
        <input type="file" id="cockpit-file" hidden multiple aria-label="attach files">
        <input type="file" id="cockpit-camera-input" hidden accept="image/*"
               capture="environment" aria-label="take a photo">
        <div id="cockpit-attached" class="cockpit-attached"></div>
        <div id="cockpit-error" class="cockpit-error" role="alert" aria-live="assertive" hidden></div>
        <div class="cockpit-row">
          <button type="button" id="cockpit-attach" title="attach files, images, voice" aria-label="attach files, images, or voice">📎</button>
          <button type="button" id="cockpit-camera" title="take a photo" aria-label="take a photo with the camera" hidden>📷</button>
          <button type="button" id="cockpit-mic" title="record a voice note" aria-label="record and send a voice note" hidden aria-pressed="false">🎙️</button>
          <button type="button" id="cockpit-edit" title="edit last message" aria-label="edit and re-run the last message">✎</button>
          <label class="sr-only" for="cockpit-text">message theseus</label>
          <textarea id="cockpit-text" rows="2" aria-describedby="cockpit-error"
            placeholder="message theseus…  (commands work: /new /usage /model /goals /skills /goal …)"></textarea>
          <button type="submit" id="cockpit-send" aria-label="send message">send</button>
        </div>
      </form>
    </div>
  </section>
  <section class="col" id="col-flow">
    <header><h2>flow</h2><span class="count" data-count="flow"></span></header>
    <div class="body" data-body="flow"></div>
  </section>
  <section class="col" id="col-tools">
    <header><h2>tools</h2><span class="count" data-count="tools"></span></header>
    <div class="body" data-body="tools"></div>
  </section>
  <section class="col" id="col-rsi">
    <header><h2>rsi digest</h2><span class="count" data-count="rsi"></span></header>
    <div class="body" data-body="rsi"></div>
  </section>
  <section class="col" id="col-sessions">
    <header><h2>sessions</h2><span class="count" data-count="sessions"></span></header>
    <div class="body" data-body="sessions"></div>
  </section>
  <section class="col" id="col-goals">
    <header><h2>goals</h2><span class="count" data-count="goals"></span></header>
    <div class="body" data-body="goals"></div>
  </section>
  <section class="col" id="col-schedules">
    <header><h2>schedules</h2><span class="count" data-count="schedules"></span></header>
    <div class="body" data-body="schedules"></div>
  </section>
  <section class="col" id="col-system">
    <header><h2>system</h2><span class="count" data-count="system"></span></header>
    <div class="usage" id="usage" title="tokens per day · last 30 days"></div>
    <div class="body" data-body="system"></div>
  </section>
</main>

<dialog id="login" aria-labelledby="login-title">
  <form id="login-form" method="dialog">
    <div class="login-title" id="login-title"><span class="glyph">◉</span>theseus deck</div>
    <p class="login-hint">Theseus deck, master-password gated.<br>
    One-time on the host: <code>bb scripts/set_web_password.bb</code></p>
    <label class="sr-only" for="login-pass">master password</label>
    <input id="login-pass" type="password" placeholder="master password" autocomplete="current-password" aria-describedby="login-error" autofocus>
    <button type="submit">unlock</button>
    <div id="login-error" class="login-error" role="alert" aria-live="assertive" hidden>wrong password</div>
  </form>
</dialog>

<dialog id="goal-detail" aria-labelledby="goal-detail-title">
  <div class="goal-detail-head">
    <div class="login-title" id="goal-detail-title"><span class="glyph">🎯</span>goal</div>
    <button type="button" id="goal-detail-close" title="close" aria-label="close goal detail">×</button>
  </div>
  <div id="goal-detail-meta" class="goal-detail-meta" aria-live="polite"></div>
  <div id="goal-detail-log" class="goal-detail-log" role="log" aria-label="goal run log"></div>
  <div id="goal-detail-actions" class="goal-detail-actions"></div>
  <div id="goal-detail-note" class="goal-detail-note" role="status" hidden></div>
</dialog>

<!-- vendored, no CDN: markdown rendering (marked) + its sanitizer
     (DOMPurify). UMD builds exposing window.marked / window.DOMPurify;
     md.js degrades to plain text if either fails to load. -->
<script defer src="/vendor/marked.min.js?v=15.0.12"></script>
<script defer src="/vendor/purify.min.js?v=3.4.17"></script>
<script defer src="/vendor/uplot.min.js?v=1.6.32"></script>
<!-- highlight.js: syntax coloring for code fences in digests and
     transcripts. Common bundle + a separate Clojure grammar (clj/edn
     aliases); the grammar self-registers onto the global hljs. -->
<script defer src="/vendor/highlight.min.js?v=11.11.1"></script>
<script defer src="/vendor/highlight-clojure.min.js?v=11.11.1"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
