<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THESEUS · deck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2339c5cf'/></svg>">
<link rel="stylesheet" href="/css/deck.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="glyph">◉</span>THESEUS<span class="tag">deck</span></div>
  <div class="meta">
    <span id="api-state" class="dim">connecting…</span>
    <span id="live" class="led off" title="poller"></span>
    <span id="clock" class="mono">--:--:-- EAT</span>
  </div>
</header>

<main id="deck">
  <section class="col col-wide" id="col-cockpit">
    <header><h2>cockpit</h2><span class="count" id="cockpit-status">idle</span></header>
    <div class="cockpit">
      <div class="cockpit-sessions">
        <select id="cockpit-session" title="session — the same files Telegram turns append to"></select>
        <button type="button" id="cockpit-new" title="fresh session">+ new</button>
      </div>
      <div class="cockpit-transcript" id="cockpit-transcript"></div>
      <div class="cockpit-job" id="cockpit-job" hidden></div>
      <form class="cockpit-compose" id="cockpit-form">
        <input type="file" id="cockpit-file" hidden multiple>
        <div id="cockpit-attached" class="cockpit-attached"></div>
        <div class="cockpit-row">
          <button type="button" id="cockpit-attach" title="attach files, images, voice">📎</button>
          <textarea id="cockpit-text" rows="2"
            placeholder="message theseus…  (commands work: /new /usage /model /goals /skills /goal …)"></textarea>
          <button type="submit" id="cockpit-send">send</button>
        </div>
      </form>
    </div>
  </section>
  <section class="col" id="col-flow">
    <header><h2>flow</h2><span class="count" data-count="flow"></span></header>
    <div class="body" data-body="flow"></div>
  </section>
  <section class="col" id="col-tools">
    <header><h2>tools</h2><span class="count" data-count="tools"></span></header>
    <div class="body" data-body="tools"></div>
  </section>
  <section class="col" id="col-rsi">
    <header><h2>rsi digest</h2><span class="count" data-count="rsi"></span></header>
    <div class="body" data-body="rsi"></div>
  </section>
  <section class="col" id="col-sessions">
    <header><h2>sessions</h2><span class="count" data-count="sessions"></span></header>
    <div class="body" data-body="sessions"></div>
  </section>
  <section class="col" id="col-goals">
    <header><h2>goals</h2><span class="count" data-count="goals"></span></header>
    <div class="body" data-body="goals"></div>
  </section>
  <section class="col" id="col-schedules">
    <header><h2>schedules</h2><span class="count" data-count="schedules"></span></header>
    <div class="body" data-body="schedules"></div>
  </section>
  <section class="col" id="col-system">
    <header><h2>system</h2><span class="count" data-count="system"></span></header>
    <div class="body" data-body="system"></div>
  </section>
</main>

<div id="login" hidden>
  <form id="login-form">
    <div class="login-title"><span class="glyph">◉</span>theseus deck</div>
    <p class="login-hint">Theseus deck, master-password gated.<br>
    One-time on the host: <code>bb scripts/set_web_password.bb</code></p>
    <input id="login-pass" type="password" placeholder="master password" autocomplete="current-password" autofocus>
    <button type="submit">unlock</button>
    <div id="login-error" class="login-error" hidden>wrong password</div>
  </form>
</div>

<!-- vendored, no CDN: markdown rendering (marked) + its sanitizer
     (DOMPurify). UMD builds exposing window.marked / window.DOMPurify;
     md.js degrades to plain text if either fails to load. -->
<script defer src="/vendor/marked.min.js"></script>
<script defer src="/vendor/purify.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
