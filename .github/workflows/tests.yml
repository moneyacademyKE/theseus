name: theseus CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'bb.edn'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'bb.edn'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theseus-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  babashka:
    name: Babashka e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Babashka
        run: sudo bash <(curl -s https://raw.githubusercontent.com/babashka/babashka/master/install)

      - name: Run e2e test suite
        run: bb test:e2e:all
