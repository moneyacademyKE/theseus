name: theseus CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'web/**'
      - 'bb.edn'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'web/**'
      - 'bb.edn'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theseus-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  babashka:
    name: Babashka e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Babashka (pinned, retried)
        run: |
          # Pinned to the version theseus is developed against — the
          # "latest" redirect delivered flaky giant-asset downloads
          # (curl exit 4/9) on three consecutive runs. Retry because
          # release-asset fetches still hiccup.
          ok=0
          for i in 1 2 3; do
            if curl -s https://raw.githubusercontent.com/babashka/babashka/master/install \
                 | sudo bash -s -- --version 1.13.222; then ok=1; break; fi
            echo "babashka install attempt $i failed; retrying in 5s"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "FATAL: babashka install failed 3x"; exit 1; }
          bb --version

      - name: Cache the go-sqlite3 pod
        # The release CDN's 504 bursts outlast every retry round (two
        # hours of red runs, Nov 9). One successful download, cached,
        # and the bursts stop mattering.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../.pods
          key: go-sqlite3-pod-v0.3.13

      - name: Install pods and clj-kondo (linux)
        run: |
          # -f: an HTTP error is a FAILURE, not an error-page saved as
          # the file (the disease behind every red run so far). The
          # pod is served from the actions cache after its first
          # successful download; kondo still installs per-run with
          # rounds of backoff. GITHUB_TOKEN auth keeps asset fetches
          # off the anonymous path.
          set -euo pipefail
          PODS="${GITHUB_WORKSPACE}/../.pods"
          fetch() { curl -fsSL --retry 6 --retry-delay 5 --retry-all-errors \
                       -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$1" -o "$2"; }
          install_pod() {
            mkdir -p "$PODS"
            fetch https://github.com/babashka/pod-babashka-go-sqlite3/releases/download/v0.3.13/pod-babashka-go-sqlite3-0.3.13-linux-amd64.zip /tmp/go-sqlite3.zip
            unzip -o /tmp/go-sqlite3.zip -d /tmp/go-sqlite3
            find /tmp/go-sqlite3 -name 'pod-babashka-go-sqlite3' -exec mv {} "$PODS/pod-babashka-go-sqlite3" \;
            chmod +x "$PODS/pod-babashka-go-sqlite3"
          }
          install_kondo() {
            fetch https://github.com/clj-kondo/clj-kondo/releases/download/v2026.08.04/clj-kondo-2026.08.04-linux-static-amd64.zip /tmp/kondo.zip
            unzip -o /tmp/kondo.zip -d /tmp/kondo
            sudo mv /tmp/kondo/clj-kondo /usr/local/bin/clj-kondo
            echo "KONDO_BIN=/usr/local/bin/clj-kondo" >> "$GITHUB_ENV"
          }
          if [ -x "$PODS/pod-babashka-go-sqlite3" ]; then
            echo "go-sqlite3 pod served from actions cache"
          else
            ok=0
            for round in 1 2 3; do
              if install_pod; then ok=1; break; fi
              echo "pod install round $round failed; backoff 30s"
              sleep 30
            done
            [ "$ok" = 1 ] || { echo "FATAL: pod install failed after 3 rounds"; exit 1; }
          fi
          ok=0
          for round in 1 2 3; do
            if install_kondo; then ok=1; break; fi
            echo "kondo install round $round failed; backoff 30s"
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "FATAL: kondo install failed after 3 rounds"; exit 1; }

      - name: Run e2e test suite
        run: bb test:e2e:all
